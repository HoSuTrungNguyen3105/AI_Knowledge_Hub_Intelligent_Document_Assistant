# AI Agent Factory — development environment
# Services: n8n only. The Code Execution Service (sandboxed
# file/build/ZIP + Dashboard on :8080) has been REMOVED from this
# package — factory workflow JSONs that called it (via CODE_EXEC_URL)
# no longer have a service to call. Copy .env.example to .env first.
# n8n keeps its own internal data in SQLite (the n8n_data volume).
# Note: this compose never had a MongoDB service — factory data lived
# in MongoDB Atlas and was only ever read/written by the removed Code
# Execution Service, so nothing in this package uses MongoDB anymore.

services:
  n8n:
    restart: unless-stopped
    # Pin an exact version in production, e.g. docker.n8n.io/n8nio/n8n:1.68.0
    image: docker.n8n.io/n8nio/n8n:latest
    environment:
      N8N_PORT: 5678
      GENERIC_TIMEZONE: ${TIMEZONE:-Asia/Ho_Chi_Minh}
      # Workflows read these through $env expressions:
      AI_FACTORY_BASE_URL: http://localhost:5678
      CODE_EXEC_URL: http://code-exec-service:8080
      # AI provider keys — read by the Agent Execution workflow via $env.
      # Values come from the .env file next to this compose file. The keys
      # themselves NEVER appear inside the workflow JSON files.
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      OLLAMA_API_KEY: ${OLLAMA_API_KEY:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      # Optional Telegram notifications (workflow 07 run completion,
      # workflow 08 weekly digest). Read via $env; empty = disabled.
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
      N8N_BLOCK_ENV_ACCESS_IN_NODE: "false"
    ports:
      - "${N8N_PORT:-5678}:5678"
    volumes:
      - n8n_data:/home/node/.n8n

volumes:
  n8n_data:
