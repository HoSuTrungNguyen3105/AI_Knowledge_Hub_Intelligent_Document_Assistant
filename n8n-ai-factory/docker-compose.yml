# AI Agent Factory — development environment
# Services: n8n (orchestration) + Code Execution Service (sandboxed
# file/build/ZIP); factory data lives in MongoDB Atlas (MONGODB_URI in
# .env). Copy .env.example to .env first.
# n8n keeps its own internal data in SQLite (the n8n_data volume); the
# factory's projects/tasks/runs/reviews live in MongoDB, written by the
# Code Execution Service — the workflows never touch a database directly.

services:
  n8n:
    # Pin an exact version in production, e.g. docker.n8n.io/n8nio/n8n:1.68.0
    image: docker.n8n.io/n8nio/n8n:latest
    environment:
      N8N_PORT: 5678
      GENERIC_TIMEZONE: ${TIMEZONE:-Asia/Ho_Chi_Minh}
      # Workflows read these through $env expressions:
      AI_FACTORY_BASE_URL: http://localhost:5678
      CODE_EXEC_URL: http://code-exec-service:8080
      # AI provider keys — read by the Agent Execution workflow via $env.
      # Values come from the .env file next to this compose file. The keys
      # themselves NEVER appear inside the workflow JSON files.
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      OLLAMA_API_KEY: ${OLLAMA_API_KEY:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      N8N_BLOCK_ENV_ACCESS_IN_NODE: "false"
    ports:
      - "${N8N_PORT:-5678}:5678"
    volumes:
      - n8n_data:/home/node/.n8n

  code-exec-service:
    build: ./code-execution-service
    environment:
      PORT: 8080
      DATA_DIR: /data
      # docker | local (local = dev only, no isolation)
      SANDBOX_MODE: ${SANDBOX_MODE:-docker}
      SANDBOX_IMAGE: ${SANDBOX_IMAGE:-node:20-alpine}
      # Absolute path of ./ces-data/workspaces ON THE HOST — needed so the
      # sandbox containers (spawned via the host Docker daemon) mount the
      # same files the service writes. Set in .env; see README.
      HOST_WORKSPACES_DIR: ${HOST_WORKSPACES_DIR:-}
      # URL the *user's browser* uses to download ZIPs:
      PUBLIC_BASE_URL: ${PUBLIC_CES_URL:-http://localhost:8080}
      # Factory data store: MongoDB Atlas — same cluster as MindFlow.
      # The URI (with the database password) comes from .env, never from
      # this file; MONGODB_DATABASE picks the database on that cluster.
      MONGODB_URI: ${MONGODB_URI:-}
      MONGODB_DATABASE: ${MONGODB_DATABASE:-mindflow_ai}
    ports:
      - "${CES_PORT:-8080}:8080"
    volumes:
      - ./ces-data:/data
      # Required for spawning sandbox containers. This grants the service
      # Docker-daemon access — run it only on a machine you control.
      - /var/run/docker.sock:/var/run/docker.sock

volumes:
  n8n_data:
